name: web
on:
  push:
    branches: [rust-port]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  build:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: ./.github/actions/web-build
      - name: Playwright smoke against vite preview
        working-directory: web
        env:
          BROWSER_CHANNEL: chromium
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Runs once the user enables Pages (Settings > Pages > Source: GitHub Actions) and sets the repository
  # variable PAGES_ENABLED=true. See Docs/superpowers/delivery.md.
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

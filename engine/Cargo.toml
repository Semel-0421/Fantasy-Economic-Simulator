[workspace]
resolver = "2"
members = ["fes-core", "fes-save", "fes-data", "fes-parity", "fes-sim", "fes-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug-assertions = false

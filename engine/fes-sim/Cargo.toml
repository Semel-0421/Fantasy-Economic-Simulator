[package]
name = "fes-sim"
edition.workspace = true
autobenches = false
version.workspace = true
publish.workspace = true

[features]
testing = ["fes-core/testing", "dep:flate2", "dep:serde_json"]

[dependencies]
fes-core = { path = "../fes-core" }
fes-data = { path = "../fes-data" }
fes-save = { path = "../fes-save" }
flate2 = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
fes-sim = { path = ".", features = ["testing"] }
fes-core = { path = "../fes-core", features = ["testing"] }
serde_json = { workspace = true }

[lints]
workspace = true

[[test]]
name = "build_speed"
path = "benches/build.rs"

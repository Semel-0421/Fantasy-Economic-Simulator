[package]
name = "fes-wasm"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `WasmSim::step_profiled` (per-system times from performance.now) for the bench.
profile = []

[dependencies]
fes-core = { path = "../fes-core", features = ["serde"] }
fes-data = { path = "../fes-data" }
fes-sim = { path = "../fes-sim", features = ["serde", "scenario"] }
serde = { workspace = true }
serde-wasm-bindgen = "=0.6.5"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
js-sys = "=0.3.77"
serde_json = { workspace = true }
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
